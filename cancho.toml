# Every dependency is a pinned store, never a copy (docs/numerics.md section 2; scripts/check_pins.sh checks this file against the document).
#   cancho-tools: the contract package, one store per module, at one rev (the nine modules cancho-ml lists).
#   cancho-table: dec, facc, flt, pow5, reader, at one rev (cancho-table#44, the rev cancho-ml pins).
#   cancho-ml: the 23 numeric modules of cancho-ml#46 (docs/stores.md of that repository), one block per module, label = module name with the dot as a dash.
#     cancho-ml#46 is not merged and its branch is not pushed: the URL is a file:// URL of a local clone at the head of the branch v1-stores
#     (docs/numerics.md section 2.3). It is replaced by https://github.com/alpibrusl/cancho-ml and the merge commit when that lands.

