# S0: the driver of the numeric gates (docs/numerics.md section 4). `cancho build --bin special-check`, after `cancho install`.
[[bin]]
name = "special-check"
sources = ["lib/special", "tools/special-check"]
std = true
out = "build/special-check"

# S0: the exact-accumulation candidates of docs/numerics.md section 5 (facc, ml.fsq and special.xprod on vectors from standard input).
[[bin]]
name = "acc-check"
sources = ["lib/special", "tools/acc-check"]
std = true
out = "build/acc-check"

# S1: the big-integer arithmetic of the exact variance (docs/describe.md section 3), checked on numbers given in hexadecimal (scripts/gate_bigint.py).
[[bin]]
name = "bigint-check"
sources = ["lib/acc", "tools/bigint-check"]
std = true
out = "build/bigint-check"

# S1: the exact power sums of acc.psum on vectors from standard input (scripts/gate_psum.py).
[[bin]]
name = "psum-check"
sources = ["lib/acc", "tools/psum-check"]
std = true
out = "build/psum-check"
