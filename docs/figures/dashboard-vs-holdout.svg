<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 228" width="640" height="228" role="img" aria-label="Estimates with their 95% intervals and the line of no effect">
<style>
:root { --bg: #fbfcfd; --fg: #14181a; --muted: #55606a; --line: #dfe5e7; --surface: #ffffff; --soft: #eff4f4; --accent: #1f5fa6; --good: #0f7b5f; --bad: #b42d27; --warn: #92400e; --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
@media (prefers-color-scheme: dark) { :root { --bg: #0b0f14; --fg: #e7ebec; --muted: #9aa8ae; --line: #212a2d; --surface: #131a1c; --soft: #172022; --accent: #8ec0ff; --good: #4fd1a5; --bad: #ff7b73; --warn: #f3c77a; } }
.fig .ax { stroke: var(--muted); stroke-width: 1; }
.fig .tk { fill: var(--muted); font: 12px var(--font); }
.fig .lb { fill: var(--muted); font: 13px var(--font); }
.fig .nm { fill: var(--fg); font: 600 13px var(--font); }
.fig .wh { stroke-width: 2; } .fig .wh.pa, .fig .bx.pa { stroke: var(--accent); } .fig .wh.pb, .fig .bx.pb { stroke: var(--good); }
.fig .bx { fill: var(--soft); stroke-width: 2; }
.fig .md { stroke: var(--fg); stroke-width: 3; }
.fig .mn { fill: var(--warn); }
.fig .zero { stroke: var(--bad); stroke-width: 1.5; stroke-dasharray: 5 4; }
.fig .ciline { stroke: var(--accent); stroke-width: 3; }
.fig .pt { fill: var(--accent); }
.fig .band { stroke: var(--line); stroke-width: 1; }
.fig .dot.pa { fill: var(--accent); opacity: .8; } .fig .dot.pb { fill: var(--good); opacity: .8; }
.fig .ring { fill: none; stroke: var(--bad); stroke-width: 2; }
.fig .pbar.pa { fill: var(--accent); } .fig .pbar.pb { fill: var(--good); } .fig .pbar.warn { fill: var(--warn); }
.fig .link { stroke: var(--muted); stroke-width: 1.5; }
.fig .raw { fill: var(--surface); stroke: var(--accent); stroke-width: 2.5; } .fig .adj { fill: var(--accent); }
.fig .cell { fill: var(--soft); stroke: var(--line); } .fig .cell.hit { fill: var(--bad); stroke: var(--bad); }
.fig .seg { fill: var(--good); } .fig .seg.bad { fill: var(--bad); }
.fig .hash { fill: var(--soft); stroke: var(--good); stroke-width: 1.5; }
.fig .hx { fill: var(--fg); font: 12px var(--mono); }
.fig .bandci { fill: var(--accent); opacity: .18; }
.fig .ecdfa { fill: none; stroke: var(--accent); stroke-width: 2.5; } .fig .ecdfb { fill: none; stroke: var(--good); stroke-width: 2.5; }
.fig .gap { stroke: var(--bad); stroke-width: 3; }
.fig .lk1 { fill: #b42d27; } .fig .lk2 { fill: #d97a52; } .fig .lk3 { fill: #c9c9c9; } .fig .lk4 { fill: #5a9bd4; } .fig .lk5 { fill: #1f5fa6; }
.fig .lk { fill: #fff; font: 600 12px var(--font); }
</style>
<rect width="640" height="228" rx="10" fill="var(--surface)" stroke="var(--line)"/>
<g class="fig"><line class="ax" x1="190" y1="176" x2="610" y2="176"/>
<line class="ax" x1="225" y1="176" x2="225" y2="181"/><text class="tk" x="225" y="195" text-anchor="middle">-2</text>
<line class="ax" x1="295" y1="176" x2="295" y2="181"/><text class="tk" x="295" y="195" text-anchor="middle">0</text>
<line class="ax" x1="365" y1="176" x2="365" y2="181"/><text class="tk" x="365" y="195" text-anchor="middle">2</text>
<line class="ax" x1="435" y1="176" x2="435" y2="181"/><text class="tk" x="435" y="195" text-anchor="middle">4</text>
<line class="ax" x1="505" y1="176" x2="505" y2="181"/><text class="tk" x="505" y="195" text-anchor="middle">6</text>
<line class="ax" x1="575" y1="176" x2="575" y2="181"/><text class="tk" x="575" y="195" text-anchor="middle">8</text>
<text class="lb" x="400" y="214" text-anchor="middle">difference in conversion, points (95% interval)</text>
<line class="zero" x1="295" y1="30" x2="295" y2="176"/><text class="tk" x="295" y="24" text-anchor="middle">no effect</text>
<text class="nm" x="182" y="58" text-anchor="end">everyone, exposed vs not</text>
<line class="ciline" x1="433.315" y1="54" x2="533.208" y2="54"/><circle class="pt" cx="481.829" cy="54" r="5"/>
<text class="tk" x="481.829" y="45" text-anchor="middle">5.3</text>
<text class="nm" x="182" y="92" text-anchor="end">quiet users only</text>
<line class="ciline" x1="336.53" y1="88" x2="460.811" y2="88"/><circle class="pt" cx="392.878" cy="88" r="5"/>
<text class="tk" x="392.878" y="79" text-anchor="middle">2.8</text>
<text class="nm" x="182" y="126" text-anchor="end">busy users only</text>
<line class="ciline" x1="342.476" y1="122" x2="515.526" y2="122"/><circle class="pt" cx="430.293" cy="122" r="5"/>
<text class="tk" x="430.293" y="113" text-anchor="middle">3.9</text>
<text class="nm" x="182" y="160" text-anchor="end">randomized holdout</text>
<line class="ciline" x1="308.434" y1="156" x2="379.741" y2="156"/><circle class="pt" cx="344" cy="156" r="5"/>
<text class="tk" x="344" y="147" text-anchor="middle">1.4</text></g>
</svg>
